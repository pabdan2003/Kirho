name: Build Windows artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"
          python -m PyInstaller --version
          choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          .\scripts\build_windows.ps1 -Python "python" -ISCC $iscc

      - name: Create portable archive
        shell: pwsh
        run: |
          $version = ([regex]::Match((Get-Content "pyproject.toml" -Raw), '(?m)^\s*version\s*=\s*"([^"]+)"\s*$')).Groups[1].Value
          if (-not $version -or -not (Test-Path "dist\Kirho\Kirho.exe")) { throw "Windows build output is incomplete." }
          Compress-Archive -Path "dist\Kirho" -DestinationPath "dist\Kirho-$version-Windows-x64-portable.zip" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kirho-Windows-x64
          path: |
            dist/Kirho-*-Windows-x64-Setup.exe
            dist/Kirho-*-Windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14
